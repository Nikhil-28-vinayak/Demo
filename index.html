
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Static Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
        }

        header {
            background-color: #198754;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #146c43;
            padding: 12px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        main {
            text-align: center;
            padding: 60px 20px;
        }

        button {
            background-color: #198754;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
        }

        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>A simple static website built with HTML and CSS</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <main id="home">
        <h2>Hello, World!</h2>
        <p>This is my first static website.</p>

        <section id="about">
            <h3>About Us</h3>
            <p>We create simple and beautiful websites.</p>
        </section>

        <section id="contact">
            <h3>Contact Us</h3>
            <p>Email: example@email.com</p>
        </section>

        <button onclick="alert('Welcome to my website!')">
            Click Me
        </button>
    </main>

    <footer>
        <p>&copy; 2026 My Static Website. All rights reserved.</p>
    </footer>

</body>
</html>
